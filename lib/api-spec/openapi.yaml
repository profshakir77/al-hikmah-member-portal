openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Member Management Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: members
  - name: payments
  - name: reports
  - name: settings
  - name: expenses
  - name: users
  - name: backup
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /members/{id}/payments:
    get:
      operationId: getMemberPayments
      tags: [members]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Member payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      parameters:
        - name: month
          in: query
          schema: { type: integer }
        - name: year
          in: query
          schema: { type: integer }
        - name: memberId
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    delete:
      operationId: deletePayment
      tags: [payments]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /payments/status:
    get:
      operationId: getPaymentStatus
      tags: [payments]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: integer }
        - name: year
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Monthly payment statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberPaymentStatus"

  /reports/dashboard:
    get:
      operationId: getDashboardStats
      tags: [reports]
      parameters:
        - name: month
          in: query
          schema: { type: integer }
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /reports/monthly:
    get:
      operationId: getMonthlyReport
      tags: [reports]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: integer }
        - name: year
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"

  /reports/yearly:
    get:
      operationId: getYearlyReport
      tags: [reports]
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Yearly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearlyReport"

  /reports/unpaid:
    get:
      operationId: getUnpaidMembers
      tags: [reports]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: integer }
        - name: year
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unpaid members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      parameters:
        - name: month
          in: query
          schema: { type: integer }
        - name: year
          in: query
          schema: { type: integer }
        - name: category
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /expenses/summary:
    get:
      operationId: getExpenseSummary
      tags: [expenses]
      parameters:
        - name: month
          in: query
          schema: { type: integer }
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Expense summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSummary"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted

  /backup/export:
    get:
      operationId: exportBackup
      tags: [backup]
      summary: Export full data backup as JSON
      responses:
        "200":
          description: Full backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupData"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    Member:
      type: object
      required: [id, registrationNumber, name, phone, status, createdAt, joinDate]
      properties:
        id: { type: integer }
        registrationNumber: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive] }
        joinDate: { type: string }
        createdAt: { type: string }

    MemberInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone: { type: string, minLength: 1 }
        email: { type: string }
        address: { type: string }
        notes: { type: string }
        joinDate: { type: string }

    MemberUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        status: { type: string, enum: [active, inactive] }
        joinDate: { type: string }

    Payment:
      type: object
      required: [id, memberId, amount, month, year, paidAt]
      properties:
        id: { type: integer }
        memberId: { type: integer }
        memberName: { type: string }
        memberRegistrationNumber: { type: string }
        amount: { type: number }
        month: { type: integer }
        year: { type: integer }
        notes: { type: ["string", "null"] }
        paidAt: { type: string }

    PaymentInput:
      type: object
      required: [memberId, amount, month, year]
      properties:
        memberId: { type: integer }
        amount: { type: number }
        month: { type: integer }
        year: { type: integer }
        notes: { type: string }

    MemberPaymentStatus:
      type: object
      required: [memberId, registrationNumber, name, phone, paid, month, year]
      properties:
        memberId: { type: integer }
        registrationNumber: { type: string }
        name: { type: string }
        phone: { type: string }
        paid: { type: boolean }
        amount: { type: ["number", "null"] }
        paidAt: { type: ["string", "null"] }
        paymentId: { type: ["integer", "null"] }
        month: { type: integer }
        year: { type: integer }

    DashboardStats:
      type: object
      required: [totalMembers, activeMembers, paidThisMonth, unpaidThisMonth, totalCollectedThisMonth, totalCollectedThisYear, totalExpensesThisMonth, netThisMonth, month, year]
      properties:
        totalMembers: { type: integer }
        activeMembers: { type: integer }
        paidThisMonth: { type: integer }
        unpaidThisMonth: { type: integer }
        totalCollectedThisMonth: { type: number }
        totalCollectedThisYear: { type: number }
        totalExpensesThisMonth: { type: number }
        netThisMonth: { type: number }
        month: { type: integer }
        year: { type: integer }

    MonthlyReport:
      type: object
      required: [month, year, totalMembers, paid, unpaid, totalCollected, expectedTotal, collectionRate, totalExpenses, net, payments]
      properties:
        month: { type: integer }
        year: { type: integer }
        totalMembers: { type: integer }
        paid: { type: integer }
        unpaid: { type: integer }
        totalCollected: { type: number }
        expectedTotal: { type: number }
        collectionRate: { type: number }
        totalExpenses: { type: number }
        net: { type: number }
        payments:
          type: array
          items:
            $ref: "#/components/schemas/MemberPaymentStatus"

    YearlyReport:
      type: object
      required: [year, totalCollected, totalExpected, totalExpenses, net, monthlyBreakdown]
      properties:
        year: { type: integer }
        totalCollected: { type: number }
        totalExpected: { type: number }
        totalExpenses: { type: number }
        net: { type: number }
        monthlyBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/MonthSummary"

    MonthSummary:
      type: object
      required: [month, year, paid, unpaid, collected, expenses, net]
      properties:
        month: { type: integer }
        year: { type: integer }
        paid: { type: integer }
        unpaid: { type: integer }
        collected: { type: number }
        expenses: { type: number }
        net: { type: number }

    Settings:
      type: object
      required: [id, organizationName, monthlyDueAmount, whatsappAlertTemplate, currency]
      properties:
        id: { type: integer }
        organizationName: { type: string }
        monthlyDueAmount: { type: number }
        whatsappAlertTemplate: { type: string }
        currency: { type: string }

    SettingsUpdate:
      type: object
      properties:
        organizationName: { type: string }
        monthlyDueAmount: { type: number }
        whatsappAlertTemplate: { type: string }
        currency: { type: string }

    Expense:
      type: object
      required: [id, title, amount, category, month, year, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        amount: { type: number }
        category: { type: string }
        month: { type: integer }
        year: { type: integer }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }

    ExpenseInput:
      type: object
      required: [title, amount, category, month, year]
      properties:
        title: { type: string, minLength: 1 }
        amount: { type: number }
        category: { type: string }
        month: { type: integer }
        year: { type: integer }
        notes: { type: string }

    ExpenseUpdate:
      type: object
      properties:
        title: { type: string }
        amount: { type: number }
        category: { type: string }
        month: { type: integer }
        year: { type: integer }
        notes: { type: ["string", "null"] }

    ExpenseSummary:
      type: object
      required: [totalExpenses, byCategory, month, year]
      properties:
        totalExpenses: { type: number }
        byCategory:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseCategoryTotal"
        month: { type: ["integer", "null"] }
        year: { type: ["integer", "null"] }

    ExpenseCategoryTotal:
      type: object
      required: [category, total, count]
      properties:
        category: { type: string }
        total: { type: number }
        count: { type: integer }

    User:
      type: object
      required: [id, username, name, role, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, viewer] }
        createdAt: { type: string }

    UserInput:
      type: object
      required: [username, name, role, password]
      properties:
        username: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        role: { type: string, enum: [admin, viewer] }
        password: { type: string, minLength: 4 }

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [admin, viewer] }
        password: { type: string }

    BackupData:
      type: object
      required: [exportedAt, members, payments, expenses, settings]
      properties:
        exportedAt: { type: string }
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        settings:
          $ref: "#/components/schemas/Settings"
